name: Update static pages

on:
  schedule:
    - cron: '2-59/10 0-15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roco-pages-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Prepare Pages worktree
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          pages_dir="$(realpath -m -- "$GITHUB_WORKSPACE/pages")"
          if [[ "$pages_dir" != "$workspace/pages" ]]; then
            echo "Refusing unexpected Pages path: $pages_dir" >&2
            exit 1
          fi
          if [[ -e "$pages_dir" ]]; then
            echo "Refusing to initialize existing Pages path: $pages_dir" >&2
            exit 1
          fi

          if git ls-remote --exit-code --heads origin refs/heads/gh-pages >/dev/null; then
            git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          else
            remote_status=$?
            if [[ "$remote_status" -ne 2 ]]; then
              echo "Unable to inspect the remote gh-pages branch" >&2
              exit "$remote_status"
            fi
            git worktree add --detach --no-checkout "$pages_dir" HEAD
            git -C "$pages_dir" switch --orphan gh-pages
          fi

      - name: Generate static pages
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: go run . -once -output "$GITHUB_WORKSPACE/pages" -state "$GITHUB_WORKSPACE/pages/state.json"

      - name: Publish changed pages
        shell: bash
        working-directory: ${{ github.workspace }}/pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html products.json onsale.json state.json
          if git diff --cached --quiet; then
            echo "Static output is unchanged"
            exit 0
          fi
          git commit -m "Update static pages"
          git push origin HEAD:gh-pages
